version: '3'

tasks:
  licenses:
    desc: Generate a report of all licenses used in the project.
    env:
      GOWORK: off
    cmds:
      - rm './resources/licenses.txt'
      - go tool go-licenses report --ignore github.com/mokiat/lacking-template --template './resources/licenses.tmpl' ./... | fold -w 80 -s > './resources/licenses.txt'

  clean:
    desc: Clean up the assets directory.
    cmds:
      - rm -r './assets'

  pack:
    desc: Prepare assets for the game.
    cmds:
      - mkdir -p './assets'
      - go run './cmd/studio' pack ./ {{.CLI_ARGS}}

  webpack:
    desc: Prepare web assets for the game.
    cmds:
      - mkdir -p './assets/web'
      - cp 'resources/ui/images/icon.png' './assets/web/favicon.png'
      - cp 'resources/web/main.css' './assets/web/main.css'
      - cp 'resources/web/main.js' './assets/web/main.js'
      - cp 'resources/web/index.html' './assets/index.html'
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" './assets/web'

  wasm:
    desc: Build the game executable for the web.
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go build -o './assets/web/main.wasm' './cmd/game'

  preview:
    desc: Preview game assets.
    cmds:
      - go run './cmd/studio' preview ./ {{.CLI_ARGS}}

  debug:
    desc: Run the game in debug mode.
    cmds:
      - go run -tags debug './cmd/game' {{.CLI_ARGS}}

  run:
    desc: Run the game.
    env:
      GODEBUG: cgocheck=0
    cmds:
      - go run './cmd/game' {{.CLI_ARGS}}

  web:
    desc: Run a web server to serve the game.
    cmds:
      - go run 'github.com/mokiat/httpserv@v1.0.0' -dir './assets' -host '127.0.0.1'

  profile-cpu:
    cmds:
      - curl -o cpu.pprof 'http://localhost:6060/debug/pprof/profile?seconds=30'
      - go tool pprof -symbolize=none cpu.pprof

  profile-allocs:
    cmds:
      - curl -o mem.pprof 'http://localhost:6060/debug/pprof/allocs'
      - go tool pprof -symbolize=none mem.pprof

  profile-allocs-delta:
    cmds:
      - curl -o mem.pprof 'http://localhost:6060/debug/pprof/allocs?seconds=10'
      - go tool pprof -symbolize=none mem.pprof

  profile-heap:
    cmds:
      - curl -o mem.pprof 'http://localhost:6060/debug/pprof/heap'
      - go tool pprof -symbolize=none mem.pprof

  profile-heap-delta:
    cmds:
      - curl -o mem.pprof 'http://localhost:6060/debug/pprof/heap?seconds=10'
      - go tool pprof -symbolize=none mem.pprof

  trace:
    cmds:
      - curl -o trace.pprof 'http://localhost:6060/debug/pprof/trace?seconds=30'
      - go tool trace trace.pprof
